<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>webterm</title>
    <link rel="stylesheet" href="/vendor/xterm.css" />
    <link rel="stylesheet" href="/app.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>%E2%96%B6</text></svg>" />
  </head>
  <body>
    <header id="tabbar" role="tablist" aria-label="Projects">
      <div id="tabs"></div>
      <button id="new-project" type="button" title="New project">
        <span aria-hidden="true">+</span> New Project
      </button>
    </header>

    <main id="panes">
      <section id="empty" hidden>
        <h1>No projects yet</h1>
        <p>Each project gets its own tmux session and its own terminal tab.</p>
        <button id="empty-new" type="button">+ New Project</button>
        <p id="empty-health" class="health"></p>
      </section>
    </main>

    <dialog id="new-dialog">
      <form method="dialog">
        <h2>New project</h2>
        <label for="f-slug">Slug</label>
        <input
          id="f-slug"
          name="slug"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="my-app"
          required
        />
        <p class="hint">Lowercase letters, digits and hyphens. Becomes the tmux session name.</p>

        <label for="f-cwd">Working directory <span class="opt">(optional)</span></label>
        <input
          id="f-cwd"
          name="cwd"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="$HOME"
        />
        <p class="hint">Absolute path to an existing directory. Defaults to your home directory.</p>

        <p id="f-error" class="error" hidden></p>
        <menu>
          <button value="cancel" type="submit" class="ghost">Cancel</button>
          <button id="f-create" value="create" type="submit" class="primary">Create</button>
        </menu>
      </form>
    </dialog>

    <div id="toasts" aria-live="polite"></div>

    <script src="/vendor/xterm.js"></script>
    <script src="/vendor/addon-fit.js"></script>
    <script src="/js/ttyd-client.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
